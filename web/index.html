  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #ffffff;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #121212;
          }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>

<body>

  </picture>
  <script>
    // Local-only: clear old service workers/caches to prevent stale Flutter Web assets
    // causing intermittent blank screens between rebuilds.
    (function () {
      var isLocalHost =
        window.location.hostname === 'localhost' ||
        window.location.hostname === '127.0.0.1';
      if (!isLocalHost) return;

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          registrations.forEach(function (registration) {
            registration.unregister();
          });
        });
      }

      if ('caches' in window) {
        caches.keys().then(function (keys) {
          keys.forEach(function (key) {
            caches.delete(key);
          });
        });
      }
    })();
  </script>
  <script>
    // Local-only: keep the Firebase Auth emulator warning visible without
    // covering bottom navigation or primary actions during visual QA.
    (function normalizeFirebaseAuthEmulatorWarning() {
      var warningText = 'Running in emulator mode. Do not use with production credentials.';
      var isLocalHost =
        window.location.hostname === 'localhost' ||
        window.location.hostname === '127.0.0.1';
      if (!isLocalHost) return;

      function normalize() {
        var nodes = Array.prototype.slice.call(document.body.children);
        nodes.forEach(function (node) {
          if (!node || !node.textContent) return;
          if (node.textContent.indexOf(warningText) === -1) return;
          if (node.id === 'splash' || node.id === 'splash-branding') return;

          node.setAttribute('data-chegaja-emulator-warning', 'true');
          node.textContent = 'Emulador Firebase ativo';
          node.style.position = 'fixed';
          node.style.top = 'calc(env(safe-area-inset-top, 0px) + 8px)';
          node.style.right = '8px';
          node.style.left = 'auto';
          node.style.bottom = 'auto';
          node.style.transform = 'none';
          node.style.zIndex = '2147483647';
          node.style.width = 'min(calc(100% - 16px), 180px)';
          node.style.padding = '2px 8px';
          node.style.borderRadius = '999px';
          node.style.border = '1px solid rgba(239, 68, 68, 0.22)';
          node.style.background = 'rgba(255, 255, 255, 0.94)';
          node.style.color = '#991B1B';
          node.style.font =
            '10px/15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
          node.style.textAlign = 'center';
          node.style.pointerEvents = 'none';
          node.style.boxShadow = '0 6px 18px rgba(17, 20, 24, 0.12)';
        });
      }

      normalize();
      new MutationObserver(normalize).observe(document.body, {
        childList: true,
        subtree: false,
      });
    })();
  </script>
  <script src="google_maps_config.js"></script>
  <script>
    (function () {
      var key = window.GOOGLE_MAPS_API_KEY;
      if (!key) {
        console.warn('Google Maps API key not set. Define window.GOOGLE_MAPS_API_KEY.');
        return;
      }
      var script = document.createElement('script');
      script.src = 'https://maps.googleapis.com/maps/api/js?key=' + key;
      script.async = true;
      document.head.appendChild(script);
    })();
  </script>
