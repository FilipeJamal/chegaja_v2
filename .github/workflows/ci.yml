name: CI sem deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validation:
    name: Validacoes sem deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          channel: stable
          cache: true

      - name: Install root Node dependencies
        run: npm ci

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Prepare Flutter env asset
        run: cp .env.example .env

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Test scripts
        run: npm run test:scripts

      - name: Flutter static analysis
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

      - name: Validate Cloud Functions discovery and Firestore trigger
        env:
          FUNCTIONS_DISCOVERY_TIMEOUT: 60000
          PILOT_MARKET_ID: pt-coimbra
          DEFAULT_CURRENCY_CODE: EUR
        run: npx firebase emulators:exec --only firestore,functions "cd functions && node scripts/ci_smoke_emulators.js"

      - name: Test Firebase rules and Functions with emulators
        env:
          PILOT_MARKET_ID: pt-coimbra
          DEFAULT_CURRENCY_CODE: EUR
        run: npx firebase emulators:exec --only firestore,storage "cd functions && npm test"

      - name: Flutter tests
        run: flutter test --no-pub
