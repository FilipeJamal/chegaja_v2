# The pilot build machine has 8 GB RAM. Leaving headroom for Flutter, R8 and
# Windows avoids paging stalls during signed release builds.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=false
